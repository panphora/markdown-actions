<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selection Preservation Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 300px;
      font-family: monospace;
      margin: 10px 0;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
    }
    .info {
      background: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Selection Preservation Test</h1>
  <p>Select a word (like "word" or "test") and click any button. The selection should remain after the operation.</p>
  
  <textarea id="editor">This is a test line with some words to select.
Try selecting a single word and clicking a button.
The selection should remain after applying the style.</textarea>
  
  <div>
    <button id="h1">H1</button>
    <button id="h2">H2</button>
    <button id="h3">H3</button>
    <button id="quote">Quote</button>
    <button id="bullet">Bullet List</button>
    <button id="numbered">Numbered List</button>
    <button id="task">Task List</button>
  </div>
  
  <div class="info">
    Selection: <span id="selection">None</span><br>
    Position: <span id="position">0-0</span>
  </div>
  
  <script type="module">
    import * as markdownActions from './dist/markdown-actions.esm.js';
    
    const textarea = document.getElementById('editor');
    const selectionSpan = document.getElementById('selection');
    const positionSpan = document.getElementById('position');
    
    function updateSelectionInfo() {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.slice(start, end);
      
      selectionSpan.textContent = selected || 'None';
      positionSpan.textContent = `${start}-${end}`;
    }
    
    textarea.addEventListener('select', updateSelectionInfo);
    textarea.addEventListener('click', updateSelectionInfo);
    textarea.addEventListener('keyup', updateSelectionInfo);
    
    document.getElementById('h1').addEventListener('click', () => {
      markdownActions.toggleH1(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('h2').addEventListener('click', () => {
      markdownActions.toggleH2(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('h3').addEventListener('click', () => {
      markdownActions.toggleH3(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('quote').addEventListener('click', () => {
      markdownActions.toggleQuote(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('bullet').addEventListener('click', () => {
      markdownActions.toggleBulletList(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('numbered').addEventListener('click', () => {
      markdownActions.toggleNumberedList(textarea);
      updateSelectionInfo();
    });
    
    document.getElementById('task').addEventListener('click', () => {
      markdownActions.toggleTaskList(textarea);
      updateSelectionInfo();
    });
    
    // Initial update
    updateSelectionInfo();
  </script>
</body>
</html>
