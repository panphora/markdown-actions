<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test insertText</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    textarea { width: 100%; height: 100px; font-family: monospace; }
    .log { background: #f0f0f0; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
    button { padding: 10px; margin: 5px; }
  </style>
</head>
<body>
  <h1>Test insertText Function</h1>
  
  <textarea id="test">Format toggling</textarea>
  
  <div>
    <button onclick="testDirectExecCommand()">Test execCommand Directly</button>
    <button onclick="testManualReplacement()">Test Manual Replacement</button>
    <button onclick="testOurImplementation()">Test Our Implementation</button>
  </div>
  
  <div class="log" id="log"></div>

  <script type="module">
    const log = (msg) => {
      document.getElementById('log').textContent += msg + '\n';
      console.log(msg);
    }
    
    window.testDirectExecCommand = function() {
      const textarea = document.getElementById('test');
      textarea.value = 'Format toggling';
      
      log('=== Test execCommand directly ===');
      log('Before: "' + textarea.value + '"');
      
      // Select the whole text
      textarea.selectionStart = 0;
      textarea.selectionEnd = 15;
      log('Selection: ' + textarea.selectionStart + '-' + textarea.selectionEnd);
      log('Selected: "' + textarea.value.slice(textarea.selectionStart, textarea.selectionEnd) + '"');
      
      // Try execCommand
      textarea.contentEditable = 'true';
      const result = document.execCommand('insertText', false, '- Format toggling');
      textarea.contentEditable = 'false';
      
      log('execCommand result: ' + result);
      log('After: "' + textarea.value + '"');
      log('');
    }
    
    window.testManualReplacement = function() {
      const textarea = document.getElementById('test');
      textarea.value = 'Format toggling';
      
      log('=== Test manual replacement ===');
      log('Before: "' + textarea.value + '"');
      
      // Select the whole text
      textarea.selectionStart = 0;
      textarea.selectionEnd = 15;
      log('Selection: ' + textarea.selectionStart + '-' + textarea.selectionEnd);
      
      // Manual replacement
      const before = textarea.value.slice(0, textarea.selectionStart);
      const after = textarea.value.slice(textarea.selectionEnd);
      const newText = '- Format toggling';
      
      log('before: "' + before + '"');
      log('after: "' + after + '"');
      log('newText: "' + newText + '"');
      
      textarea.value = before + newText + after;
      
      log('After: "' + textarea.value + '"');
      log('');
    }
    
    window.testOurImplementation = async function() {
      const textarea = document.getElementById('test');
      textarea.value = 'Format toggling';
      
      log('=== Test our implementation ===');
      log('Before: "' + textarea.value + '"');
      
      // Import our module
      const md = await import('./dist/markdown-actions.esm.js');
      
      // Select text
      textarea.selectionStart = 0;
      textarea.selectionEnd = 0;
      
      log('Calling toggleBulletList...');
      md.toggleBulletList(textarea);
      
      log('After: "' + textarea.value + '"');
      log('');
    }
  </script>
</body>
</html>
