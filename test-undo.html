<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undo Test - Markdown Actions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 4px;
    }
    .toolbar {
      margin-bottom: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    button {
      margin-right: 10px;
      padding: 8px 16px;
      background: #0366d6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #0256c7;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #fffbdd;
      border: 1px solid #f0e68c;
      border-radius: 4px;
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Undo Test - Markdown Actions</h1>
  
  <div class="info">
    <strong>Test Instructions:</strong>
    <ol>
      <li>Type or select some text in the textarea</li>
      <li>Click one of the formatting buttons (Bold, Italic, Code)</li>
      <li>Press Ctrl+Z (or Cmd+Z on Mac) to test undo</li>
      <li>The text should revert to its previous state</li>
    </ol>
  </div>

  <div class="toolbar">
    <button onclick="markdownActions.toggleBold(textarea)">Bold</button>
    <button onclick="markdownActions.toggleItalic(textarea)">Italic</button>
    <button onclick="markdownActions.toggleCode(textarea)">Code</button>
    <button onclick="markdownActions.toggleQuote(textarea)">Quote</button>
    <button onclick="markdownActions.toggleBulletList(textarea)">Bullet List</button>
    <button onclick="markdownActions.insertLink(textarea)">Link</button>
  </div>

  <textarea id="textarea" placeholder="Type some text here and test the formatting buttons...">This is some sample text.
Select any part and click a button.
Then try Ctrl+Z to undo.

Multiple lines can be selected
for block formatting like quotes.</textarea>

  <script type="module">
    import markdownActions from './dist/markdown-actions.esm.js';
    
    // Make it available globally for onclick handlers
    window.markdownActions = markdownActions;
    window.textarea = document.getElementById('textarea');
    
    // Log when actions are performed
    textarea.addEventListener('input', (e) => {
      console.log('Input event fired');
    });
    
    // Enable debug mode to see what's happening
    markdownActions.setDebugMode(true);
  </script>
</body>
</html>
